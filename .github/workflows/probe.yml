name: API probe
on:
  push:
    branches: [claude/api-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { java-version: '21', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew createMinecraftArtifacts
      - name: Unpack
        run: |
          A=build/moddev/artifacts
          mkdir -p /tmp/cls /tmp/res /tmp/vf
          unzip -qo $A/neoforge-21.11.48.jar -d /tmp/cls
          unzip -qo $A/neoforge-21.11.48-client-extra-aka-minecraft-resources.jar -d /tmp/res || true
          cp -r /tmp/cls/data /tmp/res/ 2>/dev/null || true
          curl -sSL -o /tmp/vf/vf.jar https://repo1.maven.org/maven2/org/vineflower/vineflower/1.11.1/vineflower-1.11.1.jar
      - name: Probe
        run: |
          bash probe.sh > out.txt 2>&1 || true
          gzip -9c out.txt | base64 -w0 > out.b64
          split -b 4000 -d -a 2 out.b64 /tmp/chunk.
          ls /tmp/chunk.* | wc -l
      - name: Emit 0
        run: |
          for n in $(seq 0 9); do f=/tmp/chunk.$(printf %02d $n); [ -f $f ] && echo "::notice title=probe-$(printf %02d $n)::$(cat $f)"; done; true
      - name: Emit 1
        run: |
          for n in $(seq 10 19); do f=/tmp/chunk.$(printf %02d $n); [ -f $f ] && echo "::notice title=probe-$(printf %02d $n)::$(cat $f)"; done; true
      - name: Emit 2
        run: |
          for n in $(seq 20 29); do f=/tmp/chunk.$(printf %02d $n); [ -f $f ] && echo "::notice title=probe-$(printf %02d $n)::$(cat $f)"; done; true
      - name: Emit 3
        run: |
          for n in $(seq 30 39); do f=/tmp/chunk.$(printf %02d $n); [ -f $f ] && echo "::notice title=probe-$(printf %02d $n)::$(cat $f)"; done; true
      - name: Emit 4
        run: |
          for n in $(seq 40 49); do f=/tmp/chunk.$(printf %02d $n); [ -f $f ] && echo "::notice title=probe-$(printf %02d $n)::$(cat $f)"; done; true
