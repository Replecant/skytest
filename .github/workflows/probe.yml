name: API probe
on:
  push:
    branches: [claude/api-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { java-version: '21', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew createMinecraftArtifacts
      - name: Unpack
        run: |
          A=build/moddev/artifacts
          mkdir -p /tmp/cls /tmp/res /tmp/vf
          unzip -qo $A/neoforge-21.11.48.jar -d /tmp/cls
          unzip -qo $A/neoforge-21.11.48-client-extra-aka-minecraft-resources.jar -d /tmp/res || true
          cp -r /tmp/cls/data /tmp/res/ 2>/dev/null || true
          curl -sSL -o /tmp/vf/vf.jar https://repo1.maven.org/maven2/org/vineflower/vineflower/1.11.1/vineflower-1.11.1.jar
      - name: Probe
        run: |
          { echo "== jars"; cat jars.txt; bash probe.sh; } > out.txt 2>&1 || true
          python3 - <<'PY'
          s = open('out.txt', encoding='utf-8', errors='replace').read()
          chunks = [s[i:i+60000] for i in range(0, len(s), 60000)][:30]
          kinds = ['notice'] * 10 + ['warning'] * 10 + ['error'] * 10
          for n, (c, k) in enumerate(zip(chunks, kinds)):
              c = c.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::{k} title=probe-{n:02d}::{c}')
          PY
