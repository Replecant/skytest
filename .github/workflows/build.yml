name: Build

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          set -o pipefail
          ./gradlew build 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          grep -E "error:|\\.java:[0-9]+|What went wrong|> " build.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Smoke test (dedicated server)
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          SKYTEST_SMOKE=true timeout 900 ./gradlew runServer > server.log 2>&1 || true
          grep -q "SKYTEST SMOKE OK" server.log

      - name: Report server errors
        if: failure()
        run: |
          [ -f server.log ] || exit 0
          grep -E "SKYTEST SMOKE|ERROR|Exception|Caused by|Failed|failed to|Couldn't|Error" server.log \
            | grep -v "DEBUG" | head -120 > errors.txt || true
          python3 - <<'PY'
          s = open('errors.txt', encoding='utf-8', errors='replace').read()
          for i in range(0, min(len(s), 40000), 3900):
              c = s[i:i+3900].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::error title=server-{i//3900:02d}::{c}')
          PY

      - name: Visual test (client screenshots)
        if: startsWith(github.ref, 'refs/heads/claude/') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils > /dev/null
          mkdir -p run/saves && rm -rf run/saves/smoke && cp -r run/world run/saves/smoke
          printf 'onboardAccessibility:false\npauseOnLostFocus:false\nguiScale:2\nrenderDistance:6\nsoundCategory_master:0.0\ntutorialStep:none\nskipMultiplayerWarning:true\nlang:ru_ru\n' > run/options.txt
          export SKYTEST_CLIENT_SMOKE=true SKYTEST_QUICKPLAY=smoke LIBGL_ALWAYS_SOFTWARE=1
          timeout 1200 xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClient > client.log 2>&1 || true
          ls -la run/screenshots || true
          grep -q "SKYTEST CLIENT SMOKE DONE" client.log

      - name: Report client errors
        if: always() && (startsWith(github.ref, 'refs/heads/claude/') || github.event_name == 'workflow_dispatch')
        run: |
          [ -f client.log ] || exit 0
          grep -E "SKYTEST|Screenshot|ERROR|Exception|Caused by|OpenGL|GL_RENDERER|Backend" client.log \
            | grep -v "DEBUG" | head -150 > cerrors.txt || true
          python3 - <<'PY'
          s = open('cerrors.txt', encoding='utf-8', errors='replace').read()
          for i in range(0, min(len(s), 38000), 3900):
              c = s[i:i+3900].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::warning title=client-{i//3900:02d}::{c}')
          PY

      - name: Publish screenshots to branch claude/screenshots
        if: always() && (startsWith(github.ref, 'refs/heads/claude/') || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -d run/screenshots ] || exit 0
          cd run/screenshots
          git init -q && git checkout -q -b shots && git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" shots:claude/screenshots

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: skytest-jar
          path: build/libs/*.jar

      # Every push to main refreshes the "latest" pre-release with a fresh jar.
      - name: Move "latest" tag to this commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Publish "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (main)
          prerelease: true
          body: |
            Автоматическая сборка последнего коммита в `main` (${{ github.sha }}).
            Minecraft 1.21.11, NeoForge 21.11.x. Скачайте `.jar` ниже и положите в папку `mods`.
          files: build/libs/*.jar

      # Pushing a tag like v0.2.0 creates a proper versioned release.
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/libs/*.jar
