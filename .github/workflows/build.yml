name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: |
          set -o pipefail
          ./gradlew build 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: |
          grep -E "error:|\\.java:[0-9]+|What went wrong|> " build.log | head -40 | while IFS= read -r line; do
            echo "::error::$line"
          done
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: skytest-jar
          path: build/libs/*.jar
